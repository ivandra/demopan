<!-- Контейнер попапа -->
<div id="nc-auth-popup-container" data-block-id="<?= (int)$cc; ?>"></div>

<script>
(function() {
    document.addEventListener('DOMContentLoaded', function() {
        var blockId = <?= (int)$cc; ?>;
<?php
        // Текст галочек — единый каскад nc_consent_text: настройка модуля auth →
        // текст из настроек сайта → (обратная совместимость) старый consentText
        // компонента → дефолт. Макросы ссылок (consent_url/privacy_policy_url/
        // rules_url) подставляются внутри resolve().
        $consentPDText = '';
        if ($nc_core->get_settings('agreed', 'auth')) {
            $consentPDText = nc_consent_text::resolve(
                nc_consent_text::SLOT_PD,
                $nc_core->get_settings('consentPDText', 'auth'),
                null,
                !empty($cc_settings['consentText']) ? $cc_settings['consentText'] : null
            );
        }

        $consentRulesText = '';
        if ($nc_core->get_settings('agreed_rules', 'auth')) {
            $consentRulesText = nc_consent_text::resolve(
                nc_consent_text::SLOT_RULES,
                $nc_core->get_settings('consentRulesText', 'auth')
            );
        }
?>
        var consentPDText = <?= json_encode($consentPDText, JSON_UNESCAPED_UNICODE | JSON_HEX_TAG); ?>;
        var consentRulesText = <?= json_encode($consentRulesText, JSON_UNESCAPED_UNICODE | JSON_HEX_TAG); ?>;

        if (typeof NcAuth !== 'undefined') {
            if (typeof NcAuth.setBlockId === 'function') {
                NcAuth.setBlockId(blockId);
            }
            if (typeof NcAuth.setConsentPDText === 'function') {
                NcAuth.setConsentPDText(consentPDText);
            }
            if (typeof NcAuth.setConsentRulesText === 'function') {
                NcAuth.setConsentRulesText(consentRulesText);
            }
        } else {
            console.error('NcAuth not found!');
        }
    });
})();
</script>
