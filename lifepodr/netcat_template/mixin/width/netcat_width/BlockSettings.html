<table class="nc-mixins-layout-table">
    <tr>
        <td>
            <label>Определённая ширина:</label>
        </td>
        <td>
            <input type="number" class="nc--medium" min="1" max="9999" value=""
                name="mixin.settings.width">
            <select name="mixin.settings.width_unit">
                <option value="px">px</option>
                <option value="%">%</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>
            <label>Ширина не менее чем:</label>
        </td>
        <td>
            <input type="number" class="nc--medium" min="1" max="9999" value=""
                name="mixin.settings.width_min">
            <select name="mixin.settings.width_min_unit">
                <option value="px">px</option>
                <option value="%">%</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>
            <label>Ширина не более чем:</label>
        </td>
        <td>
            <input type="number" class="nc--medium" min="1" max="9999" value=""
                name="mixin.settings.width_max">
            <select name="mixin.settings.width_max_unit">
                <option value="px">px</option>
                <option value="%">%</option>
            </select>

        </td>
    </tr>
</table>
