<script>
(function() {
    var prefix = '.nc-mixins-mixin-settings-netcat-layout-swiper',
        singleSlideEffects = ['fade', 'cube', 'flip', 'cards'];

    function init(event, data) {
        var settings = $nc(this).find(prefix);
        if (!settings.length) {
            settings = $nc(prefix);
        }
        if (!settings.length || settings.data('swiper-initialized')) {
            return;
        }

        var effectSelect = settings.find(prefix + '-effect select'),
            arrowsOptions = settings.find(prefix + '-arrows-options'),
            arrowsBgOptions = settings.find(prefix + '-arrows-bg-options'),
            arrowsBorderOptions = settings.find(prefix + '-arrows-border-options'),
            paginationOptions = settings.find(prefix + '-pagination-options'),
            bulletsOptions = settings.find(prefix + '-bullets-options'),
            progressbarOptions = settings.find(prefix + '-progressbar-options'),
            fractionOptions = settings.find(prefix + '-fraction-options');

        // Количество слайдов -> эффекты
        settings.find(prefix + '-slides-per-view select').on('change', function() {
            var slidesVal = $nc(this).val();
            if (slidesVal == 1) {
                effectSelect.find('option').prop('disabled', false);
            } else {
                effectSelect.find('option').each(function() {
                    var opt = $nc(this);
                    if (singleSlideEffects.indexOf(opt.val()) !== -1) {
                        opt.prop('disabled', true);
                    }
                });
                if (singleSlideEffects.indexOf(effectSelect.val()) !== -1) {
                    effectSelect.val('slide');
                }
            }
        }).trigger('change');

        // Показ стрелок -> настройки стрелок
        settings.find('input[name="mixin.settings.show_arrows"]').on('change', function() {
            if ($nc(this).is(':checked')) {
                arrowsOptions.show();
            } else {
                arrowsOptions.hide();
            }
        }).trigger('change');

        // Тип пагинации -> зависимые настройки
        settings.find('select[name="mixin.settings.pagination_type"]').on('change', function() {
            var paginationType = $nc(this).val();
            if (paginationType !== '') {
                paginationOptions.show();
            } else {
                paginationOptions.hide();
            }
            if (paginationType === 'bullets') {
                bulletsOptions.show();
            } else {
                bulletsOptions.hide();
            }
            if (paginationType === 'progressbar') {
                progressbarOptions.show();
            } else {
                progressbarOptions.hide();
            }
            if (paginationType === 'fraction') {
                fractionOptions.show();
            } else {
                fractionOptions.hide();
            }
        }).trigger('change');

        // Форма фона стрелок -> цвет фона
        settings.find('select[name="mixin.settings.arrows_bg_shape"]').on('change', function() {
            if ($nc(this).val() !== '') {
                arrowsBgOptions.show();
            } else {
                arrowsBgOptions.hide();
            }
        }).trigger('change');

        // Толщина рамки -> цвет рамки
        settings.find('input[name="mixin.settings.arrows_border_width"]').on('input change', function() {
            var borderWidth = parseInt($nc(this).val(), 10) || 0;
            if (borderWidth > 0) {
                arrowsBorderOptions.show();
            } else {
                arrowsBorderOptions.hide();
            }
        }).trigger('change');

        settings.data('swiper-initialized', true);
    }

    // Инициализация при загрузке значений миксина
    $nc(prefix).closest('.nc-mixins-mixin-settings')
        .off(nc_mixin_settings_editor.mixin_settings_set_values_event + prefix)
        .on(nc_mixin_settings_editor.mixin_settings_set_values_event + prefix, init);

})();
</script>
