    <script>
        (function() {
            var onReady = function() {
                var paginations = document.querySelectorAll('nav.pagination');
                for (var i = 0; i < paginations.length; i++) {
                    var pages = paginations[i].querySelectorAll('.pagination-page');
                    var activeIndex = -1;
                    for (var j = 0; j < pages.length; j++) {
                        if (pages[j].className.indexOf('active') !== -1) {
                            activeIndex = j;
                            break;
                        }
                    }
                    if (activeIndex === -1) { continue; }

                    var neighbors = [activeIndex - 1, activeIndex, activeIndex + 1];
                    for (var k = 0; k < neighbors.length; k++) {
                        var idx = neighbors[k];
                        if (idx >= 0 && idx < pages.length) {
                            pages[idx].className += ' pagination-page-visible';
                        }
                    }
                }
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', onReady);
            } else {
                onReady();
            }
        })();
    </script>
