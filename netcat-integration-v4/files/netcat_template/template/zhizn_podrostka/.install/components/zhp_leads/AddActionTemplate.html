<?php
$_SESSION["zhp_sent"][] = time();
$_SESSION["zhp_sent"] = array_slice($_SESSION["zhp_sent"], -10);
$zhp_to = trim(shortcode("[email_to]"));
$zhp_from = trim(shortcode("[email_from]"));
$zhp_delivery = "Сохранено в Netcat; email выключен";
if (
    shortcode("[email_enabled]") === "1" &&
    shortcode("[demo]") !== "1" &&
    filter_var($zhp_to, FILTER_VALIDATE_EMAIL) &&
    filter_var($zhp_from, FILTER_VALIDATE_EMAIL) &&
    !preg_match('/[\r\n]/', $zhp_to . $zhp_from)
) {
    $zhp_subject = "=?UTF-8?B?" . base64_encode("Заявка — Жизнь подростка") . "?=";
    $zhp_body =
        "Форма: " .
        $f_form_type .
        "\nИмя: " .
        $f_name .
        "\nТелефон: " .
        $f_phone .
        "\nEmail: " .
        $f_email .
        "\nКонтакт: " .
        $f_contact .
        "\nСообщение: " .
        $f_message .
        "\nОтветы: " .
        $f_answers .
        "\nДомен: " .
        $f_domain .
        "\nСтраница: " .
        $f_page_url;
    $zhp_delivery = mail(
        $zhp_to,
        $zhp_subject,
        $zhp_body,
        "From: " . $zhp_from . "\r\nContent-Type: text/plain; charset=UTF-8",
    )
        ? "Письмо передано почтовой системе"
        : "Ошибка отправки email; заявка сохранена";
}
$db->query(
    "UPDATE Message" .
        (int) $classID .
        " SET delivery='" .
        $db->escape($zhp_delivery) .
        "' WHERE Message_ID=" .
        (int) $message,
);
?>
<div data-zhp-success>Спасибо! Заявка сохранена.</div>
