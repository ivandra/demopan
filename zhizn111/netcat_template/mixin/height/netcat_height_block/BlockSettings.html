<table class="nc-mixins-layout-table">
    <tr>
        <td>
            <label>Определенная высота:</label>
        </td>
        <td>
            <input type="number" class="nc--medium" min="1" max="9999" value=""
                   name="mixin.settings.height">
            <select name="mixin.settings.height_unit">
                <option value="px">пикс.</option>
                <option value="%">%</option>
                <option value="vh">vh</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>
            <label>Высота не менее чем:</label>
        </td>
        <td>
            <input type="number" class="nc--medium" min="1" max="9999" value=""
                   name="mixin.settings.height_min">
            <select name="mixin.settings.height_min_unit">
                <option value="px">пикс.</option>
                <option value="%">%</option>
                <option value="vh">vh</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>
            <label>Высота не более чем:</label>
        </td>
        <td>
            <input type="number" class="nc--medium" min="1" max="9999" value=""
                   name="mixin.settings.height_max">
            <select name="mixin.settings.height_max_unit">
                <option value="px">пикс.</option>
                <option value="%">%</option>
                <option value="vh">vh</option>
            </select>
        </td>
    </tr>

</table>
